name: CI — Tests, PostgreSQL & Smoke

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test-suite:
    name: Tests & smoke PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: janitou_user
          POSTGRES_PASSWORD: janitou_dev_password
          POSTGRES_DB: janitou_food_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U janitou_user -d janitou_food_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://janitou_user:janitou_dev_password@localhost:5432/janitou_food_db?schema=public
      JANITOU_STORAGE: postgres
      BACKUP_ENABLED: '0'
      MESSAGING_ENABLED: '0'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build shared packages
        run: bun run build:bun

      - name: Generate Prisma client
        run: bun run --cwd packages/database db:generate

      - name: Apply migrations
        run: bun run --cwd packages/database db:migrate

      - name: Unit & integration tests
        run: bun test

      - name: PostgreSQL smoke — auth, role matrix, backup, restore validation
        run: |
          NODE_ENV=production bun apps/api/src/server.ts > /tmp/api.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4000/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4000/health > /dev/null
          ADMIN=$(curl -fsS -X POST http://127.0.0.1:4000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@janitou.dz","password":"Admin@2026"}' | jq -r .token)
          CHEF=$(curl -fsS -X POST http://127.0.0.1:4000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"chef@janitou.dz","password":"Chef@2026"}' | jq -r .token)
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CHEF" http://127.0.0.1:4000/api/v1/customers)" = "403"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CHEF" http://127.0.0.1:4000/api/v1/system/backup)" = "403"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $ADMIN" http://127.0.0.1:4000/api/v1/system/backup)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $ADMIN" -H 'X-Reauth-Password: Admin@2026' http://127.0.0.1:4000/api/v1/system/backup)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $ADMIN" -H 'Content-Type: application/json' -H 'X-Reauth-Password: Admin@2026' -d '{"data":{"orders":"bad"}}' http://127.0.0.1:4000/api/v1/system/restore)" = "400"

      - name: Print API log on failure
        if: failure()
        run: tail -100 /tmp/api.log
